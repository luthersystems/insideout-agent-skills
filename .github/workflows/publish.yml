name: Publish to skills.sh

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Register skill on skills.sh
    runs-on: ubuntu-latest
    # Skip SNAPSHOT tags
    if: "!contains(github.ref_name, 'SNAPSHOT')"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Register skill via npx skills add
        run: npx -y skills add luthersystems/insideout-agent-skills
